[package]
name = "warcraft-survivors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Warcraft Survivors: the benilla client booted server-less into a top-down survival mode on ten battlegrounds"

[lints]
workspace = true

[features]
default = ["dev", "coop"]
dev = ["benilla-app/dev", "benilla-formats/dev", "survivors-app/dev"]
coop = ["survivors-app/coop"]

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
# The mode itself; without defaults, `dev` arrives through the feature above.
survivors-app = { path = "../survivors-app", default-features = false }
clap.workspace = true

# The Windows player build (`player.rs`): Velopack installs and updates it from the GitHub
# releases, rfd asks for the WoW data folder. Neither is compiled anywhere else. rfd's named
# buttons need Common Controls 6, which the manifest from build.rs asks for.
[target.'cfg(windows)'.dependencies]
velopack = "1.2.161"
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }
# The exe's icon and manifest on Windows (build.rs); does nothing for other targets.
winresource = { version = "0.1.34", default-features = false }

[[bin]]
name = "warcraft-survivors"
path = "src/main.rs"
test = false
